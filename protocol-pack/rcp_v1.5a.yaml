    role: normative-resolution
    language: pl
  compatibility:
    tasking_modes:
    - neutral_code
    - no_code
    conductor_modes:
    - ai_monitor
    - human_user
    target_exposure_classes:
    - public
    - private
  execution:
    initial_step: rcp.prepare
    target_blindness: required
    max_extension_cycles_default: 3
  steps:
  - step_id: rcp.prepare
    kind: preparation
    order: 0
    required: true
    source_anchor: Preamble + foundational principles
    expected_output:
      validator_id: generic.nonempty.v1
      validator_version: 1
    completion:
      gate: validator-pass
      validator_id: generic.nonempty.v1
    retry:
      allowed: true
      max_logical_attempts: 2
    checkpoint:
      required: false
      authority: engine
      adjunct_probes: none
    transitions:
    - event: COMPLETE
      action: goto
      target_step: rcp.phase1
  - step_id: rcp.phase1
    kind: phase
    order: 1
    required: true
    source_anchor: Phase 1 — 6 AI touches
    expected_output:
      validator_id: rcp.phase1.v1
      validator_version: 1
      counts:
        touches: 6
    completion:
      gate: validator-pass
      validator_id: rcp.phase1.v1
    retry:
      allowed: true
      max_logical_attempts: 2
    checkpoint:
      required: false
      authority: engine
      adjunct_probes: none
    transitions:
    - event: COMPLETE
      action: goto
