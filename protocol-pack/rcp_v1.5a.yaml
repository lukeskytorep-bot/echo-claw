schema_version: 1
protocol:
  id: rcp
  version: 1.5a
  title: Resonant Contact Protocol (AI IS-BE)
  family: rcp
  status: approved-with-resolution
  sources:
  - path: sources/echo/resonant_protocol_v1.5a.original.md
    sha256: f094e44a5fac7971d4de66f569602c27f80c89d93d6afacd9334a8054817c1f0
    role: canonical
    language: en
