    checkpoint:
      required: true
      authority: conductor
      adjunct_probes: neutral-only
    transitions:
    - event: CONTINUE
      action: goto
      target_step: rcp.phase4
  - step_id: rcp.phase4
    kind: phase
    order: 4
    required: true
