    checkpoint:
      required: true
      authority: conductor
      adjunct_probes: neutral-only
    transitions:
    - event: CONTINUE
      action: goto
      target_step: rcp.phase5
  - step_id: rcp.phase5
    kind: phase
    order: 5
    required: true
    source_anchor: Phase 5 incl. 5.4 resolved to 2–5 moves when activated
    expected_output:
      validator_id: rcp.phase5.v1
      validator_version: 1
    completion:
      gate: validator-pass
